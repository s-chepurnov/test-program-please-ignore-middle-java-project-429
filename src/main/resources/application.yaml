spring:
  application:
    name: flightbooking
  datasource:
    url: ${DATABASE_URL:postgres://postgres:postgres@localhost:5432/flight-booking}
  web:
    resources:
      static-locations:
        - classpath:/public/
        - file:./public/
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}
